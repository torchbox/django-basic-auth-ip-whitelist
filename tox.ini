[tox]
envlist =
    py311-dj52
    py{312,313,314,315}-dj{52,60,61}
    ruff

[testenv]
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
commands =
    python run_tests.py

[testenv:ruff]
extras = lint
basepython = python3
changedir = {toxinidir}
usedevelop = false
commands =
    ruff format --check
    ruff check
